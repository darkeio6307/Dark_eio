<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Anime | Live Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1115;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 20px;
            text-align: center;
            padding: 0 15px;
        }

        header h1 {
            color: #ff4757;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        header p {
            color: #a4b0be;
            margin-top: 0;
            font-size: 0.9rem;
        }

        .player-container {
            width: 90%;
            max-width: 850px;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #2f3542;
            margin-bottom: 25px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-container {
            width: 90%;
            max-width: 850px;
            background-color: #1e222b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #ff4757;
            border-bottom: 1px solid #2f3542;
            padding-bottom: 8px;
        }

        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .ep-btn {
            background-color: #2f3542;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ep-btn:hover {
            background-color: #ff4757;
        }

        .ep-btn.active {
            background-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Naruto Shippuden</h1>
        <p>मल्टी-सर्वर सपोर्ट (क्वालिटी बदलने के लिए प्लेयर की सेटिंग्स देखें)</p>
    </header>

    <div class="player-container">
        <iframe id="main-player" src="https://vidsrc.me/embed/tv/31910/1/1" allowfullscreen></iframe>
    </div>

    <div class="controls-container">
        <h3 class="section-title">एपिसोड्स चुनें (Select Episode)</h3>
        <div class="episode-grid">
            <button class="ep-btn active" onclick="changeEpisode(1, this)">EP 01</button>
            <button class="ep-btn" onclick="changeEpisode(2, this)">EP 02</button>
            <button class="ep-btn" onclick="changeEpisode(3, this)">EP 03</button>
            <button class="ep-btn" onclick="changeEpisode(4, this)">EP 04</button>
            <button class="ep-btn" onclick="changeEpisode(5, this)">EP 05</button>
            <button class="ep-btn" onclick="changeEpisode(6, this)">EP 06</button>
        </div>
    </div>

    <script>
        function changeEpisode(epNumber, buttonElement) {
            const player = document.getElementById('main-player');
            
            // एनिमे की सही TMDB ID (Naruto Shippuden के लिए 31910) और सीज़न (1)
            const tmdbId = "31910"; 
            const season = "1"; 

            // नया लिंक जिसमें नाम नहीं, ID जा रही है
            player.src = `https://vidsrc.me/embed/tv/${tmdbId}/${season}/${epNumber}`;

            // बटन का कलर बदलने का लॉजिक
            const currentActive = document.querySelector('.ep-btn.active');
            if (currentActive) {
                currentActive.classList.remove('active');
            }
            buttonElement.classList.add('active');
        }
    </script>

</body>
</html>
